# Receita de publicacao no Render. Deixar isso versionado no repositorio
# significa que a configuracao do servidor tambem tem historico - se um dia
# algo mudar e quebrar, da para ver o que era antes.
services:
  - type: web
    name: barbestial
    runtime: node
    plan: starter # o plano free nao permite disco, e sem disco o ranking se perde
    region: virginia # o mais perto do Brasil entre os disponiveis
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /saude

    # O BANCO PRECISA DE UM LUGAR QUE SOBREVIVA A REINICIOS.
    # O disco abaixo e montado em /var/data e continua la depois de cada deploy.
    # Sem ele, o arquivo do SQLite vive no sistema de arquivos temporario do
    # container: funciona enquanto o servidor esta de pe e some no proximo
    # deploy, levando junto as contas e o ranking.
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Alem do efeito normal, isto FECHA o modo de teste do login com Google:
      # ver a trava em server/auth/google.js.
      - key: NODE_ENV
        value: production

      # Onde o SQLite guarda tudo. Tem que apontar para dentro do disco acima.
      - key: BANCO_CAMINHO
        value: /var/data/barbestial.db

      # Chave que assina os craches de sessao. generateValue faz o Render
      # sortear um valor forte e guardar - ele nunca aparece no repositorio.
      # Trocar essa chave desloga todo mundo (e so isso).
      - key: SESSAO_SEGREDO
        generateValue: true

      # Fuso usado para decidir quando a semana vira. -180 = horario de Brasilia.
      - key: FUSO_MINUTOS
        value: "-180"

      # Senha do painel /admin. Preencha no painel do Render (Environment).
      # SEM ela, /admin nao existe (404) - e assim que tem que ser em producao
      # se voce nao quiser o painel.
      - key: ADMIN_SEGREDO
        sync: false

      # Login com Google: preencha no painel do Render (Environment), nunca aqui.
      # OBRIGATORIO: sem esta variavel ninguem consegue se CADASTRAR, porque
      # toda conta precisa de um Google conectado (e ele que devolve o acesso
      # de quem esquece a senha). Quem ja tem conta ainda entra por senha.
      - key: GOOGLE_CLIENT_ID
        sync: false
